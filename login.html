<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.ico">
    <title>Área do Aluno | Autoescola São Gotardo</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <!-- BOTÃO FLUTUANTE PARA MOSTRAR/ESCONDER MODO CLARO -->
    <div class="theme-toggle-floating">
        <button id="themeToggleBtn" class="btn-theme-toggle" title="Alternar Modo Claro/Escuro" aria-label="Alternar tema">
            <i class="fas fa-moon" id="themeIcon"></i>
        </button>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <a href="index.html" class="logo logo-center">
                <img src="Logo.png" alt="Autoescola São Gotardo" class="nav-logo">
            </a>

            <div class="auth-header-title">
                <h2>Área do Aluno</h2>
                <p>Acesse seu curso teórico e simulados</p>
            </div>

            <!-- ABAS PARA ALTERNAR ENTRE LOGIN E CADASTRO -->
            <div class="auth-tabs">
                <!-- Executa switchTab('login') no JS ao clicar -->
                <div class="tab active" id="tabLogin" onclick="switchTab('login')">Entrar na Conta</div>
                <!-- Executa switchTab('registro') no JS ao clicar -->
                <div class="tab" id="tabRegister" onclick="switchTab('registro')">Criar Nova Conta</div>
            </div>

            <!-- DIV RESERVADA PARA EXIBIR MENSAGENS DE SUCESSO OU ERRO -->
            <div id="authMessage" class="auth-msg"></div>

            <!-- FORMULÁRIO DE LOGIN -->
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail"><i class="fas fa-envelope"></i> Seu E-mail:</label>
                    <input type="email" id="loginEmail" placeholder="seu@email.com" required autocomplete="email">
                </div>

                <div class="form-group password-group">
                    <label for="loginPassword"><i class="fas fa-lock"></i> Sua Senha:</label>
                    <div class="input-with-icon">
                        <input type="password" id="loginPassword" placeholder="Digite sua senha" required autocomplete="current-password">
                        <!-- Chama a função JS togglePassword para alternar o tipo entre 'password' e 'text' -->
                        <button type="button" class="btn-eye" onclick="togglePassword('loginPassword', 'eyeIcon1')" aria-label="Mostrar ou ocultar senha">
                            <i class="fas fa-eye" id="eyeIcon1"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-send btn-full">
                    Acessar Curso
                </button>
            </form>

            <!-- FORMULÁRIO DE CADASTRO (INICIALMENTE ESCONDIDO COM A CLASSE .hidden) -->
            <form id="registerForm" class="hidden">
                <div class="form-group">
                    <label for="regNome"><i class="fas fa-user"></i> Nome Completo:</label>
                    <input type="text" id="regNome" placeholder="Seu nome completo" required autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="regEmail"><i class="fas fa-envelope"></i> Seu E-mail:</label>
                    <input type="email" id="regEmail" placeholder="seu@email.com" required autocomplete="email">
                </div>

                <div class="form-group password-group">
                    <label for="regPassword"><i class="fas fa-lock"></i> Crie uma Senha:</label>
                    <div class="input-with-icon">
                        <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password">
                        <button type="button" class="btn-eye" onclick="togglePassword('regPassword', 'eyeIcon2')" aria-label="Mostrar ou ocultar senha">
                            <i class="fas fa-eye" id="eyeIcon2"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-send btn-full">
                    <i class="fas fa-user-plus"></i> Concluir Cadastro
                </button>
            </form>

            <div class="back-link">
                <a href="index.html"><i class="fas fa-arrow-left"></i> Voltar à Página Inicial</a>
            </div>
        </div>
    </div>

    <!-- Conecta com o script exclusivo da tela de login -->
    <script src="login.js"></script>
</body>
</html>
